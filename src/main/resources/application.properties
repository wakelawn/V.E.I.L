spring.application.name=V.E.I.L

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:v.e.i.l}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Saved connections live here. Passwords are never written to this file;
# the UI asks for the password when a connection is activated.
veil.connections.file=${VEIL_CONNECTIONS_FILE:}

veil.ai.nvidia.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
veil.ai.nvidia.model=${NVIDIA_NIM_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
veil.ai.nvidia.api-key=${NVIDIA_API_KEY:}
veil.ai.nvidia.temperature=0.2
veil.ai.nvidia.max-tokens=4096
veil.ai.nvidia.timeout-seconds=60

# JWT Authentication
veil.auth.jwt-secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
veil.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate limiting (configured in RateLimitConfig)
# bucket4j enabled via spring-boot-starter
