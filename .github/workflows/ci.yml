name: CI

on:
  push:
    branches: [deploy-render, final]
  pull_request:
    branches: [final]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run test suite
        env:
          DB_PASSWORD: 9707810398
        run: sh mvnw test

      - name: Validate frontend JavaScript syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs >/dev/null 2>&1 || true
          for f in $(find src/main/resources/static/JS -name '*.js'); do
            echo "Checking $f"
            node --check "$f" || exit 1
          done
          echo "All JS files valid"

      - name: Check HTML files exist
        run: |
          for f in index.html login.html; do
            test -f "src/main/resources/static/$f" || { echo "Missing: $f"; exit 1; }
            echo "$f: present"
          done

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/*.txt
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy-render'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: false
          tags: veil:ci
