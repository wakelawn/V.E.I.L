# VEIL's own metadata store (users, projects, query history) for tests.
veil.metadata.url=jdbc:h2:mem:veil-metadata-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
veil.metadata.username=sa
veil.metadata.password=

# "Target" database used by explain/benchmark code paths in tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable security for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Disable NVIDIA API for tests
veil.ai.nvidia.api-key=

# Test user
veil.auth.email=test@veil.local
veil.auth.password=testpass
veil.auth.jwt-secret=test-secret-key-for-testing-only-must-be-long-enough-32chars
