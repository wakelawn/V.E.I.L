spring.application.name=V.E.I.L

# Render (and most PaaS) inject PORT; bind to it and honour proxy headers.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Target database that VEIL analyzes. SPRING_DATASOURCE_URL also works.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:v.e.i.l}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Saved connections live here. Passwords are never written to this file;
# the UI asks for the password when a connection is activated.
veil.connections.file=${VEIL_CONNECTIONS_FILE:}

veil.ai.nvidia.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
veil.ai.nvidia.model=${NVIDIA_NIM_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
veil.ai.nvidia.api-key=${NVIDIA_API_KEY:}
veil.ai.nvidia.temperature=0.2
veil.ai.nvidia.max-tokens=1500
veil.ai.nvidia.timeout-seconds=45

# Single-account login. Set a bcrypt hash in production; the plain value is
# for local development only. With neither set, a random password is logged.
veil.auth.email=${VEIL_AUTH_EMAIL:admin@veil.local}
veil.auth.password=${VEIL_AUTH_PASSWORD:}
veil.auth.password-hash=${VEIL_AUTH_PASSWORD_HASH:}
veil.auth.jwt-secret=${JWT_SECRET:}
veil.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Extra origins for split frontend hosting; same-origin needs no CORS.
veil.cors.allowed-origins=${VEIL_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
